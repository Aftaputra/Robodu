name: robodu
description: Robot Control Application

publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=2.19.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  wifi_iot: ^0.3.19
  network_info_plus: ^5.0.1
  connectivity_plus: ^5.0.1
  logger: ^2.6.2
  get: ^4.7.2
  intl: ^0.20.2
  permission_handler: ^11.3.1
  flutter_sound: ^9.2.13
  scidart: ^0.0.2-dev.12
  path_provider: ^2.1.1
  camera: ^0.10.5+9
  image: ^4.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
    - assets/pad.png
    - assets/robodu.tflite
    - assets/model.tflite

flutter_icons:
  android: true
  ios: true
  image_path: "assets/logo.png"